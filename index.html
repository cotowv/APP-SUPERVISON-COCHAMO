<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Supervisión de Vivienda · Cochamó</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supervisión">
<link rel="apple-touch-icon" href="icon.png">
<script>
if('serviceWorker' in navigator){
  let recargando=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(recargando) return; recargando=true; window.location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage('skipWaiting');
          }
        });
      });
    }).catch(()=>{});
  });
}
</script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1c2733;
    --ink-soft:#5a6b7b;
    --line:#d7dee6;
    --line-soft:#e8edf2;
    --bg:#f2f5f8;
    --panel:#ffffff;
    --brand:#0f4c81;
    --brand-deep:#0a3a63;
    --ok:#1f7a4d;
    --ok-bg:#e6f4ec;
    --no:#b3271e;
    --no-bg:#fbe9e7;
    --obs:#a8720a;
    --obs-bg:#fdf3e0;
    --shadow:0 1px 3px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:16px;line-height:1.45;
    padding-bottom:200px;
  }
  header{
    background:linear-gradient(160deg,var(--brand) 0%,var(--brand-deep) 100%);
    color:#fff;padding:16px 18px;position:sticky;top:0;z-index:50;
    box-shadow:0 2px 12px rgba(10,58,99,.25);
  }
  header .head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  header .head-text{flex:1;min-width:0}
  header .logo{
    width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  header .kicker{font-size:12px;letter-spacing:.5px;opacity:.85;margin:0}
  header h1{font-size:18px;margin:2px 0 0;font-weight:600}
  header .meta{font-size:12.5px;opacity:.9;margin-top:4px}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  label.fld{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  input[type=text]{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:#fbfcfd;color:var(--ink);
  }
  input[type=text]:focus{outline:none;border-color:var(--brand);background:#fff}
  .row2{display:flex;gap:12px}
  .row2>div{flex:1}
  .plano-box{margin-top:12px}
  .plano-preview{
    margin-top:10px;border:1px dashed var(--line);border-radius:10px;
    padding:8px;text-align:center;background:#fbfcfd;
  }
  .plano-preview img{max-width:100%;border-radius:6px;display:block;margin:0 auto}
  .plano-preview .doc{padding:14px;color:var(--ink-soft);font-size:14px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;
    padding:12px 16px;cursor:pointer;background:var(--brand);color:#fff;width:100%;
  }
  .btn.ghost{background:#eef3f8;color:var(--brand);border:1px solid var(--line)}
  .btn.sm{padding:9px 12px;font-size:14px;width:auto}
  .filepick{position:relative;overflow:hidden}
  .filepick input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .section-title{
    font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.4px;
    margin:22px 4px 10px;display:flex;align-items:center;gap:8px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .item{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow);
  }
  .item .q{font-size:14.5px;line-height:1.35;margin-bottom:11px}
  .item .num{color:var(--ink-soft);font-weight:700;margin-right:6px}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .opt{
    border:1.5px solid var(--line);border-radius:9px;padding:9px 4px;text-align:center;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
    background:#fbfcfd;transition:.12s;
  }
  .opt.ok.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opt.no.on{border-color:var(--no);background:var(--no-bg);color:var(--no)}
  .opt.obs.on{border-color:var(--obs);background:var(--obs-bg);color:var(--obs)}
  .extra{margin-top:11px;display:none}
  .extra.show{display:block}
  .extra textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-family:inherit;font-size:15px;resize:vertical;min-height:60px;background:#fbfcfd;
  }
  .extra textarea:focus{outline:none;border-color:var(--brand);background:#fff}
  .photo-label{font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 2px}
  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .photo-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .photo-thumb img{width:100%;height:100%;object-fit:cover}
  .photo-thumb .del{
    position:absolute;top:2px;right:2px;background:rgba(179,39,30,.92);color:#fff;
    width:18px;height:18px;border-radius:50%;font-size:12px;line-height:18px;text-align:center;cursor:pointer;
  }
  .addphoto{
    width:64px;height:64px;border:1.5px dashed var(--line);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--brand);
    font-size:22px;position:relative;overflow:hidden;background:#fbfcfd;cursor:pointer;
  }
  .addphoto input{position:absolute;inset:0;opacity:0}
  .progress-bar{
    position:sticky;top:0;z-index:40;height:4px;background:var(--line-soft);
  }
  .progress-bar>div{height:100%;background:var(--ok);width:0;transition:width .3s}
  .footer-bar{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 16px;display:flex;gap:10px;z-index:60;box-shadow:0 -2px 14px rgba(20,40,60,.08);
  }
  .footer-bar .wrapf{max-width:760px;margin:0 auto;width:100%;display:flex;gap:10px}
  .count{font-size:12px;color:var(--ink-soft);text-align:center;margin:8px 0 2px}
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
    opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .saved-list{margin-top:8px}
  .saved-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfd;
  }
  .saved-row .info b{font-size:14.5px}
  .saved-row .info span{font-size:12px;color:var(--ink-soft);display:block}
  .saved-row .acts{display:flex;gap:6px;flex-shrink:0}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--brand)}
  .mini.danger{color:var(--no)}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:14px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px}
  .tag.done{background:var(--ok-bg);color:var(--ok)}
  details summary{cursor:pointer;font-weight:600;color:var(--brand);font-size:14px}
  hr.soft{border:none;border-top:1px solid var(--line-soft);margin:16px 0}
</style>
</head>
<body>
<header>
  <div class="head-top">
    <div class="head-text">
      <p class="kicker">SERVICIOS DE ENERGÍA CIUDAD LUZ</p>
      <h1>Supervisión de Vivienda</h1>
      <div class="meta">Proyecto Cochamó · Registro en terreno (offline)</div>
    </div>
    <img class="logo" src="logo.jpeg" alt="Logo Ciudad Luz">
  </div>
</header>
<div class="progress-bar"><div id="prog"></div></div>

<div class="wrap">

  <!-- Datos de la casa -->
  <div class="panel" id="panelDatos">
    <label class="fld">N° o ID de vivienda</label>
    <input type="text" id="idVivienda" placeholder="Ej: Casa 042 / Beneficiario ..." autocomplete="off">
    <div class="row2" style="margin-top:12px">
      <div>
        <label class="fld">Supervisor</label>
        <input type="text" id="inspector" placeholder="Nombre" autocomplete="off">
      </div>
    </div>
    <div class="plano-box">
      <label class="fld">Plano del beneficiario (para comparar)</label>
      <div class="filepick">
        <button class="btn ghost" type="button">📄 Cargar plano (foto o PDF)</button>
        <input type="file" id="planoInput" accept="image/*,application/pdf">
      </div>
      <div class="plano-preview" id="planoPreview" style="display:none"></div>
    </div>
    <p class="count" id="fechaAuto"></p>
  </div>

  <!-- Checklist -->
  <div id="checklist"></div>

  <div class="count" id="resumen"></div>

  <!-- Guardadas -->
  <div class="panel">
    <details>
      <summary>📁 Supervisiones guardadas (<span id="savedCount">0</span>)</summary>
      <div class="saved-list" id="savedList"><div class="empty">Aún no hay supervisiones guardadas.</div></div>
      <hr class="soft">
      <button class="btn ghost sm" style="width:100%" onclick="exportAllJSON()">⬇ Respaldar todo (archivo de datos)</button>
      <div class="filepick" style="margin-top:8px">
        <button class="btn ghost sm" type="button" style="width:100%">⬆ Restaurar respaldo</button>
        <input type="file" id="restoreInput" accept="application/json">
      </div>
    </details>
  </div>
</div>

<div class="footer-bar">
  <div class="wrapf">
    <button class="btn ghost" onclick="nuevaInspeccion()">Nueva</button>
    <button class="btn" onclick="guardarYPDF()">Guardar y generar PDF</button>
  </div>
</div>

<div class="toast" id="toast"></div>

// Número correlativo global (1..N) a partir de sección e índice
function numGlobal(si,ii){
  let n=0;
  for(let s=0;s<si;s++) n+=SECCIONES[s].items.length;
  return n+ii+1;
}
let actual = nuevaEstructura();
let planoData = null; // {tipo:'img'|'pdf', data, nombre}

function nuevaEstructura(){
  const o = {};
  SECCIONES.forEach((s,si)=>s.items.forEach((_,ii)=>{ o[si+"-"+ii]={estado:null,obs:"",fotos:[]}; }));
  return o;
}

// ---------- Render checklist ----------
function renderChecklist(){
  const cont = document.getElementById('checklist');
  cont.innerHTML = "";
  SECCIONES.forEach((sec,si)=>{
    const t = document.createElement('div');
    t.className='section-title';
    t.textContent = sec.titulo;
    cont.appendChild(t);
    sec.items.forEach((q,ii)=>{
      const key = si+"-"+ii;
      const st = actual[key];
      const item = document.createElement('div');
      item.className='item';
      item.innerHTML = `
        <div class="q"><span class="num">${numGlobal(si,ii)}.</span>${q}</div>
        <div class="opts">
          <div class="opt ok ${st.estado==='ok'?'on':''}" data-k="${key}" data-v="ok">Cumple</div>
          <div class="opt no ${st.estado==='no'?'on':''}" data-k="${key}" data-v="no">No cumple</div>
          <div class="opt obs ${st.estado==='obs'?'on':''}" data-k="${key}" data-v="obs">Con obs.</div>
        </div>
        <div class="extra show" id="ex-${key}">
          <textarea placeholder="Observación (opcional)..." data-obs="${key}">${st.obs||""}</textarea>
          <div class="photo-label">Fotos de este punto</div>
          <div class="photo-strip" id="ps-${key}"></div>
        </div>`;
      cont.appendChild(item);
      renderFotos(key);
    });
  });
  const spacer=document.createElement('div');
  spacer.style.height='340px';
  spacer.style.textAlign='center';
  spacer.style.color='#9aa8b5';
  spacer.style.fontSize='12px';
  spacer.style.paddingTop='16px';
  spacer.textContent='Versión 12 · fin del checklist';
  cont.appendChild(spacer);
  bindOpts();
  actualizarProgreso();
}

function bindOpts(){
  document.querySelectorAll('.opt').forEach(o=>{
    o.onclick = ()=>{
      const k=o.dataset.k, v=o.dataset.v;
      actual[k].estado = (actual[k].estado===v)?null:v;
      // refrescar grupo
      document.querySelectorAll(`.opt[data-k="${k}"]`).forEach(x=>x.classList.remove('on'));
      if(actual[k].estado) o.classList.add('on');
      actualizarProgreso();
    };
  });
  document.querySelectorAll('textarea[data-obs]').forEach(t=>{
    t.oninput = ()=>{ actual[t.dataset.obs].obs = t.value; };
  });
}

function renderFotos(key){
  const ps = document.getElementById('ps-'+key);
  if(!ps) return;
  ps.innerHTML="";
  actual[key].fotos.forEach((f,idx)=>{
    const d=document.createElement('div');
    d.className='photo-thumb';
    const img=document.createElement('img'); img.src=f;
    const del=document.createElement('div'); del.className='del'; del.textContent='×';
    del.onclick=()=>{ actual[key].fotos.splice(idx,1); renderFotos(key); };
    d.appendChild(img); d.appendChild(del);
    ps.appendChild(d);
  });
  const add=document.createElement('label');
  add.className='addphoto';
  add.appendChild(document.createTextNode('+'));
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=e=>agregarFoto(e,key);
  add.appendChild(inp);
  ps.appendChild(add);
}

function agregarFoto(e,key){
  const files=Array.from(e.target.files||[]); if(!files.length) return;
  Promise.all(files.map(file=>comprimirImagen(file,900,0.6))).then(datas=>{
    actual[key].fotos.push(...datas);
    renderFotos(key);
  });
}

// Compresión para no saturar el almacenamiento del teléfono
function comprimirImagen(file,maxW,quality){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const c=document.createElement('canvas');
        c.width=img.width*scale; c.height=img.height*scale;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}

function actualizarProgreso(){
  const entradas=Object.entries(actual).filter(([k])=>!k.startsWith('_'));
  const total=entradas.length;
  const vals=entradas.map(([,v])=>v);
  const hechos=vals.filter(x=>x.estado).length;
  document.getElementById('prog').style.width=(hechos/total*100)+"%";
  const ok=vals.filter(x=>x.estado==='ok').length;
  const no=vals.filter(x=>x.estado==='no').length;
  const obs=vals.filter(x=>x.estado==='obs').length;
  document.getElementById('resumen').innerHTML=
    `${hechos}/${total} puntos revisados · <b style="color:var(--ok)">✓ ${ok}</b> · <b style="color:var(--no)">✗ ${no}</b> · <b style="color:var(--obs)">⚠ ${obs}</b>`;
}

  const file=e.target.files[0]; if(!file) return;
  if(file.type==='application/pdf'){
    const r=new FileReader();
    r.onload=ev=>{
      planoData={tipo:'pdf',data:ev.target.result,nombre:file.name};
      document.getElementById('planoPreview').style.display='block';
      document.getElementById('planoPreview').innerHTML=`<div class="doc">📄 ${file.name}<br><small>PDF cargado — se adjunta al respaldo</small></div>`;
    };
    r.readAsDataURL(file);
  }else{
    comprimirImagen(file,1400,0.7).then(data=>{
      planoData={tipo:'img',data,nombre:file.name};
      document.getElementById('planoPreview').style.display='block';
      document.getElementById('planoPreview').innerHTML=`<img src="${data}">`;
    });
  }
};

// ---------- Fecha ----------
function setFecha(){
  const d=new Date();
  actual._fecha = d.toLocaleString('es-CL',{dateStyle:'long',timeStyle:'short'});
  document.getElementById('fechaAuto').textContent="🕒 "+actual._fecha;
}

// ---------- Guardado local ----------
const STORE='cochamo_inspecciones';
function getSaved(){ try{return JSON.parse(localStorage.getItem(STORE))||[]}catch(e){return []} }
function setSaved(a){
  try{ localStorage.setItem(STORE,JSON.stringify(a)); }
  catch(e){ toast('⚠ No se pudo guardar. Abre desde Archivos/Safari, no desde WhatsApp.'); }
  renderSaved();
}

function renderSaved(){
  const arr=getSaved();
  document.getElementById('savedCount').textContent=arr.length;
  const list=document.getElementById('savedList');
  if(!arr.length){ list.innerHTML='<div class="empty">Aún no hay supervisiones guardadas.</div>'; return; }
  list.innerHTML='';
  arr.forEach((ins,i)=>{
    const row=document.createElement('div');
    row.className='saved-row';
    row.innerHTML=`<div class="info"><b>${ins.id||'(sin ID)'}</b><span>${ins.fecha||''} · ${ins.inspector||'—'}</span></div>
      <div class="acts">
        <button class="mini" onclick="regenerarPDF(${i})">PDF</button>
        <button class="mini danger" onclick="borrar(${i})">Borrar</button>
      </div>`;
    list.appendChild(row);
  });
}

function borrar(i){
  if(!confirm('¿Borrar esta supervisión del teléfono?')) return;
  const arr=getSaved(); arr.splice(i,1); setSaved(arr); toast('Supervisión borrada');
}

// ---------- Guardar y PDF ----------
function snapshot(){
  return {
    id:document.getElementById('idVivienda').value.trim(),
    inspector:document.getElementById('inspector').value.trim(),
    fecha:actual._fecha,
    plano:planoData,
    datos:JSON.parse(JSON.stringify(
      Object.fromEntries(Object.entries(actual).filter(([k])=>!k.startsWith('_')))
    ))
  };
}

function guardarYPDF(){
  const id=document.getElementById('idVivienda').value.trim();
  if(!id){ toast('Ingresa el N° o ID de vivienda'); document.getElementById('idVivienda').focus(); return; }
  const snap=snapshot();
  const arr=getSaved(); arr.push(snap); setSaved(arr);
  toast('Guardado en el teléfono ✓');
  generarPDF(snap);
}

function regenerarPDF(i){ generarPDF(getSaved()[i]); }

// Dibuja una imagen dentro de una caja (maxW x maxH) SIN deformarla:
// la escala manteniendo su proporción real y la centra (como "contain" en CSS).
function addImageFit(doc, data, x, y, maxW, maxH, opts){
  opts = opts || {};
  let w = maxW, h = maxH;
  try{
    const props = doc.getImageProperties(data);
    const ratio = props.width / props.height;
    w = maxW; h = maxW / ratio;
    if(h > maxH){ h = maxH; w = maxH * ratio; }
  }catch(e){}
  const ox = x + (maxW - w)/2;
  const oy = y + (maxH - h)/2;
  if(opts.frame){
    doc.setDrawColor(220,225,230);
    if(opts.fill){ doc.setFillColor(248,249,250); doc.rect(x,y,maxW,maxH,'FD'); }
    else doc.rect(x,y,maxW,maxH,'S');
  }
  try{ doc.addImage(data,'JPEG',ox,oy,w,h); }
  catch(e){ doc.setDrawColor(200); doc.rect(x,y,maxW,maxH); }
  return h;
}

function generarPDF(snap){
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210, M=14; let y=0;
  const label={ok:'CUMPLE',no:'NO CUMPLE',obs:'CON OBSERVACIONES',null:'—'};
  const col={ok:[31,122,77],no:[179,39,30],obs:[168,114,10]};

  // Encabezado
  doc.setFillColor(15,76,129); doc.rect(0,0,W,26,'F');
  const logoS=18, logoX=W-M-logoS, logoY=4;
  doc.setFillColor(255,255,255); doc.roundedRect(logoX,logoY,logoS,logoS,2,2,'F');
  try{ doc.addImage(LOGO_DATA,'JPEG',logoX+1,logoY+1,logoS-2,logoS-2); }catch(e){}
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Supervisión de Vivienda · Proyecto Cochamó',M,12);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Servicios de Energía Ciudad Luz SpA',M,18);
  doc.text('Vivienda: '+(snap.id||'—')+'   |   Supervisor: '+(snap.inspector||'—')+'   |   '+(snap.fecha||''),M,23);
  y=34; doc.setTextColor(28,39,51);

  const nombres = SECCIONES.flatMap((s,si)=>s.items.map((q,ii)=>({key:si+'-'+ii,q,sec:s.titulo,si,ii})));
  let secActual='';
  const PH=42, PW=56, GAP=6; // alto/ancho de foto y separación

  nombres.forEach(({key,q,sec,si,ii})=>{
    const st=snap.datos[key]||{estado:null,obs:'',fotos:[]};
    const num = numGlobal(si,ii);
    const fotos = st.fotos||[];
    if(sec!==secActual){
      secActual=sec;
      if(y>250){doc.addPage();y=20;}
      doc.setFillColor(238,243,248); doc.rect(M,y,W-2*M,7,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(15,76,129);
      doc.text(sec.toUpperCase(),M+2,y+5); y+=10; doc.setTextColor(28,39,51);
    }
    const qLines=doc.splitTextToSize(num+'. '+q,120);
    const obsLines = st.obs ? doc.splitTextToSize('Obs: '+st.obs,175) : [];
    // filas de fotos (3 por fila)
    const perRow=3, rows=Math.ceil(fotos.length/perRow);
    const fotosH = fotos.length ? rows*(PH+GAP)+2 : 0;
    const blockH=qLines.length*4.3 + (obsLines.length*3.6+2) + fotosH + 6;
    if(y+blockH>285){doc.addPage();y=20;}
    // texto del punto
    doc.setFont('helvetica','normal'); doc.setFontSize(9.3);
    doc.text(qLines,M,y+3.5);
    const c=col[st.estado]||[120,120,120];
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...c);
    doc.text(label[st.estado],W-M,y+3.5,{align:'right'});
    doc.setTextColor(28,39,51);
    let yy=y+qLines.length*4.3;
    if(obsLines.length){
      doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(90,107,123);
      doc.text(obsLines,M+2,yy+3); yy+=obsLines.length*3.6+1; doc.setTextColor(28,39,51);
    }
    // fotos de ESTE punto, justo debajo
    if(fotos.length){
      yy+=3;
      let x=M;
      fotos.forEach((f,fi)=>{
        if(fi>0 && fi%perRow===0){ x=M; yy+=PH+GAP; }
        addImageFit(doc,f,x,yy,PW,PH,{frame:true,fill:true});
        x+=PW+GAP;
      });
      yy+=PH+GAP;
    }
    doc.setDrawColor(232,237,242); doc.line(M,yy+2,W-M,yy+2);
    y=yy+6;
  });

  // Plano
  if(snap.plano && snap.plano.tipo==='img'){
    doc.addPage(); y=20;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(15,76,129);
    doc.text('Plano del beneficiario',M,y); doc.setTextColor(28,39,51);
    addImageFit(doc,snap.plano.data,M,y+6,W-2*M,285-(y+6),{frame:false});
  }

  const fname=('Supervision_'+(snap.id||'vivienda')+'_'+(snap.fecha||'').replace(/[^0-9]/g,'').slice(0,8)).replace(/\s+/g,'_')+'.pdf';
  doc.save(fname);
  toast('PDF generado ✓');
}

// ---------- Nueva ----------
function nuevaInspeccion(){
  if(!confirm('¿Comenzar una nueva supervisión? Se limpiará la pantalla actual (las guardadas se conservan).')) return;
  actual=nuevaEstructura(); planoData=null;
  document.getElementById('idVivienda').value='';
  document.getElementById('planoPreview').style.display='none';
  document.getElementById('planoPreview').innerHTML='';
  setFecha(); renderChecklist();
  window.scrollTo({top:0,behavior:'smooth'});
  toast('Lista para nueva vivienda');
}

// ---------- Respaldo ----------
function exportAllJSON(){
  const blob=new Blob([JSON.stringify(getSaved())],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='respaldo_cochamo_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Respaldo descargado');
}
document.getElementById('restoreInput').onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw 0;
      const arr=getSaved().concat(data);
      setSaved(arr); toast('Respaldo restaurado ('+data.length+')');
    }catch(err){ toast('Archivo no válido'); }
  };
  r.readAsText(file);
};

// ---------- Toast ----------
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

// ---------- Init ----------
function init(){
  try{
    setFecha(); renderChecklist(); renderSaved();
    const insp=document.getElementById('inspector');
    try{ insp.value=localStorage.getItem('cochamo_inspector')||''; }catch(e){}
    insp.oninput=()=>{ try{localStorage.setItem('cochamo_inspector',insp.value)}catch(e){} };
  }catch(err){
    const c=document.getElementById('checklist');
    if(c) c.innerHTML='<div class="panel" style="border-color:#b3271e"><b style="color:#b3271e">Error al cargar el checklist</b><br><small>'+(err&&err.message?err.message:err)+'</small></div>';
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
</script>
